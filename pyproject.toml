[project]
name = "ralph"
version = "0.1.0"
description = "Autonomous AI development loop using Claude Code"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest >=8.0",
    "pytest-cov >=4.0",
    "ruff >=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["lib"]
exclude = ["*.pyc", "__pycache__"]

[tool.hatch.build.sources]
"lib" = "lib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
